# yaml-language-server: $schema=https://raw.githubusercontent.com/octo-sts/app/refs/heads/main/pkg/octosts/octosts.TrustPolicy.json

# Lets dopa's release workflow, through this tap's sign.yml, start notarize.yml here.
issuer: https://token.actions.githubusercontent.com
audience: octo-sts.dev
subject_pattern: '^repo:gw31415(@24710985)?/dopa(@1366535207)?:ref:refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

claim_pattern:
  repository: '^gw31415/dopa$'
  repository_id: '^1366535207$'
  repository_owner_id: '^24710985$'
  repository_visibility: '^public$'
  event_name: '^release$'
  ref: '^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
  ref_type: '^tag$'
  runner_environment: '^github-hosted$'
  workflow_ref: '^gw31415/dopa/\.github/workflows/release\.yml@refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
  job_workflow_ref: '^gw31415/homebrew-tap/\.github/workflows/sign\.yml@refs/heads/main$'

permissions:
  actions: write
