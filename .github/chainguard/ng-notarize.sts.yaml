# yaml-language-server: $schema=https://raw.githubusercontent.com/octo-sts/app/refs/heads/main/pkg/octosts/octosts.TrustPolicy.json

# Lets ng's release workflow, through this tap's sign.yml, start notarize.yml here.
issuer: https://token.actions.githubusercontent.com
audience: octo-sts.dev
subject_pattern: '^repo:gw31415(@24710985)?/ng(@1456673485)?:.*$'

claim_pattern:
  repository: '^gw31415/ng$'
  repository_id: '^1456673485$'
  repository_owner_id: '^24710985$'
  repository_visibility: '^public$'
  ref: '^refs/heads/main$'
  runner_environment: '^github-hosted$'
  workflow_ref: '^gw31415/ng/\.github/workflows/release-macos\.yml@refs/heads/main$'
  job_workflow_ref: '^gw31415/homebrew-tap/\.github/workflows/sign\.yml@refs/heads/main$'

permissions:
  actions: write
