# yaml-language-server: $schema=https://raw.githubusercontent.com/octo-sts/app/refs/heads/main/pkg/octosts/octosts.TrustPolicy.json

issuer: https://token.actions.githubusercontent.com
audience: octo-sts.dev
subject: repo:gw31415@24710985/dopa@1366535207:environment:homebrew-release

# Limit federation to the public dopa release workflow and stable SemVer tags.
claim_pattern:
