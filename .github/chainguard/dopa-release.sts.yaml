  repository_id: '^1366535207$'
  repository_owner: '^gw31415$'
  repository_owner_id: '^24710985$'
  repository_visibility: '^public$'
  event_name: '^release$'
  ref: '^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
  ref_type: '^tag$'
  runner_environment: '^github-hosted$'
  environment: '^homebrew-release$'
  workflow_ref: '^gw31415/dopa/\.github/workflows/release\.yml@refs/(heads/main|tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$'

