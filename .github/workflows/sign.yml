name: sign # reusable: an app's release workflow calls this to get its .app signed and notarized

# Usage, in a job of the app's release workflow:
#
#   sign:
#     needs: build
#     permissions: { id-token: write }
#     uses: gw31415/homebrew-tap/.github/workflows/sign.yml@main
#     with: { app: ng, artifact: unsigned }
#
# `artifact` (in the caller's run) holds one zip of the unsigned .app. When the
# job ends, the caller's run has the artifact "signed" with <bundle>.zip:
# Developer ID signed, notarized and stapled.
#
# This runs in the caller's repository and holds no Apple secret. It gets a
# short-lived token for the tap from octo-sts (identity <app>-notarize, see
# .github/chainguard/), renewed while it waits, starts notarize.yml here and
# waits for it.

on:
  workflow_call:
    inputs:
      app: { type: string, required: true }
      artifact: { type: string, required: true }

permissions: {}

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      id-token: write
    steps:
      - name: Ask the tap to sign and notarize, then wait
        shell: bash
        env:
          APP: ${{ inputs.app }}
          ARTIFACT: ${{ inputs.artifact }}
        run: |
          set -euo pipefail
          tap=gw31415/homebrew-tap
          # The octo-sts exchange (what octo-sts/action does), done here so the
          # token can be renewed: it lasts an hour, and Apple may take longer.
          renew() {
            local oidc
            oidc=$(curl -fsS --retry 3 --retry-all-errors -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=octo-sts.dev" | jq -r .value)
            GH_TOKEN=$(curl -fsS --retry 3 --retry-all-errors -H "Authorization: Bearer ${oidc}" \
              "https://octo-sts.dev/sts/exchange?scope=${tap}&identity=${APP}-notarize" | jq -r .token)
            [[ -n "${GH_TOKEN}" && "${GH_TOKEN}" != null ]] || { echo "::error::octo-sts gave no token"; return 1; }
            echo "::add-mask::${GH_TOKEN}"
            export GH_TOKEN
            renewed=${SECONDS}
          }
          renew

          request="${GITHUB_REPOSITORY//\//-}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # gh prints the new run's URL; take the run id from it.
          url=$(gh workflow run notarize.yml --repo "${tap}" --ref main \
            -f app="${APP}" -f run-id="${GITHUB_RUN_ID}" -f artifact="${ARTIFACT}" -f request="${request}" 2>&1 \
            | grep -Eo "https://github.com/${tap}/actions/runs/[0-9]+" | tail -1)
          id=${url##*/}
          [[ -n "${id}" ]] || { echo "::error::notarize.yml did not start"; exit 1; }
          echo "Notarization run: ${url}" >>"${GITHUB_STEP_SUMMARY}"
          echo "Waiting for ${url}"

          while :; do
            (( SECONDS - renewed < 2700 )) || renew
            state=$(gh api "repos/${tap}/actions/runs/${id}" --jq '"\(.status) \(.conclusion)"' || echo "unknown -")
            [[ "${state}" == completed* ]] && break
            sleep 60
          done
          [[ "${state}" == "completed success" ]] || { echo "::error::${url} ended: ${state}"; exit 1; }
          renew
          gh run download "${id}" --repo "${tap}" --name signed --dir signed

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: signed, path: signed/ }
