name: sign # reusable: an app's release workflow calls this to get its .app signed and notarized

# Usage, in a job of the app's release workflow:
#
#   sign:
#     needs: build
#     permissions: { id-token: write }
#     uses: gw31415/homebrew-tap/.github/workflows/sign.yml@main
#     with: { app: ng, artifact: unsigned }
#
# `artifact` (in the caller's run) holds one zip of the unsigned .app. When the
# job ends, the caller's run has the artifact "signed" with <bundle>.zip:
# Developer ID signed, notarized and stapled.
#
# This runs in the caller's repository and holds no Apple secret. It gets a
# short-lived token for the tap from octo-sts (identity <app>-notarize, see
# .github/chainguard/), starts notarize.yml here and waits for it.

on:
  workflow_call:
    inputs:
      app: { type: string, required: true }
      artifact: { type: string, required: true }

permissions: {}

jobs:
  sign:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - id: sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: gw31415/homebrew-tap
          identity: ${{ inputs.app }}-notarize

      - name: Ask the tap to sign and notarize, then wait
        shell: bash
        env:
          GH_TOKEN: ${{ steps.sts.outputs.token }}
          APP: ${{ inputs.app }}
          ARTIFACT: ${{ inputs.artifact }}
        run: |
          set -euo pipefail
          tap=gw31415/homebrew-tap
          request="${GITHUB_REPOSITORY//\//-}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh workflow run notarize.yml --repo "${tap}" --ref main \
            -f app="${APP}" -f run-id="${GITHUB_RUN_ID}" -f artifact="${ARTIFACT}" -f request="${request}"
          id=
          for _ in {1..30}; do
            id=$(gh run list --repo "${tap}" --workflow notarize.yml --event workflow_dispatch --limit 50 \
              --json databaseId,displayTitle \
              --jq "map(select(.displayTitle == \"notarize ${APP} ${request}\"))[0].databaseId // empty")
            [[ -n "${id}" ]] && break
            sleep 5
          done
          [[ -n "${id}" ]] || { echo "::error::notarize.yml did not start"; exit 1; }
          echo "Notarization run: ${GITHUB_SERVER_URL}/${tap}/actions/runs/${id}" >>"${GITHUB_STEP_SUMMARY}"
          gh run watch "${id}" --repo "${tap}" --exit-status --interval 30 >/dev/null
          gh run download "${id}" --repo "${tap}" --name signed --dir signed

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: signed, path: signed/ }
